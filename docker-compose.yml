version: '3.8'

services:
  signalforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalforge_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
    restart: unless-stopped
